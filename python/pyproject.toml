[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "intangiblecapital"
version = "2026.9.24"
description = "Load the Ewens, Peters and Wang knowledge and organization capital stocks for Compustat firms."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Ewens" }]
dependencies = ["pandas>=1.5"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering", "Intended Audience :: Science/Research"]

[project.urls]
Homepage = "https://intangiblesdata.org"
Repository = "https://github.com/michaelewens/Intangible-capital-stocks"

[tool.setuptools.packages.find]
where = ["."]
include = ["intangiblecapital*"]
